name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulcan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vulcan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python service dependencies
        run: |
          ./.venv/bin/pip install -e ./ai/api[dev]
          ./.venv/bin/pip install -e ./backend/api[dev]
          ./.venv/bin/pip install -e ./backend/discovery[dev]
          ./.venv/bin/pip install -e ./backend/ingestion-gateway[dev]
          ./.venv/bin/pip install -e ./backend/jobs[dev]
          ./.venv/bin/pip install -e ./backend/query-api[dev]

      - name: Verify Phase 1
        run: ./scripts/verify-phase1.sh

      - name: Verify read-only discovery
        run: pnpm test:discovery

      - name: Verify ingestion, jobs and query services
        run: |
          PYTHONPATH=backend/ingestion-gateway ./.venv/bin/python -m pytest backend/ingestion-gateway/tests -q
          PYTHONPATH=backend/jobs ./.venv/bin/python -m pytest backend/jobs/tests -q
          PYTHONPATH=backend/query-api ./.venv/bin/python -m pytest backend/query-api/tests -q

      - name: Apply migrations on a clean PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vulcan
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/supabase/local/init/001_supabase_compat.sql
          ./scripts/apply-supabase-migrations.sh

      - name: Verify platform RLS
        env:
          VULCAN_PLATFORM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vulcan
        run: ./scripts/verify-platform-expansion.sh
