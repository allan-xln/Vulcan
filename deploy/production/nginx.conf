user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  log_format structured escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"request_id":"$request_id"}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream vulcan_backend {
    server backend:3001;
    keepalive 32;
  }

  upstream vulcan_frontend {
    server frontend:3002;
    keepalive 32;
  }

  server {
    listen 8080 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      proxy_pass http://vulcan_backend/healthz;
      proxy_set_header Host $host;
    }

    location = /readyz {
      proxy_pass http://vulcan_backend/readyz;
      proxy_set_header Host $host;
    }

    location = /livez {
      proxy_pass http://vulcan_backend/livez;
      proxy_set_header Host $host;
    }

    location = /version {
      proxy_pass http://vulcan_backend/version;
      proxy_set_header Host $host;
    }

    location /api/realtime/ {
      proxy_pass http://vulcan_backend/realtime/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass http://vulcan_backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
    }

    location /downloads/agents/ {
      alias /srv/agents/;
      autoindex off;
      add_header Cache-Control "private, max-age=300";
    }

    location / {
      proxy_pass http://vulcan_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
